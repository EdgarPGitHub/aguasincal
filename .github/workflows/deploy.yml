# Despliegue a Raiola por FTP cifrado (FTPS) al fusionar en main, o a mano: Actions → Despliegue → Run workflow.
#
# No hace nada hasta que exista la variable DESPLIEGUE_ACTIVO=si (así, fusionar antes de tener los secretos no da errores).
#
# En el servidor (carpeta personal de la cuenta FTP):
#   <CARPETA_PUBLICA>/  ← web generada (dist/)
#   aguasincal-app/     ← código PHP + vendor + plantillas
#   aguasincal-data/    ← config.local.php; la web crea aquí la base de datos, app.key y las copias (nunca se borra)
#
# Secretos (Settings → Secrets and variables → Actions → Secrets): ver docs/PASOS.md
#   FTP_HOST, FTP_USUARIO, FTP_CLAVE, SMTP_PASS, PANEL_RUTA, ADMIN_EMAIL, ADMIN_CLAVE
#   opcionales: LEADS_EMAIL (info@dominio), FTP_PORT (21), SMTP_USUARIO (info@dominio), SMTP_HOST (mail.dominio)
# Variables (Settings → Secrets and variables → Actions → Variables):
#   DESPLIEGUE_ACTIVO=si   activa el despliegue
#   CARPETA_PUBLICA        raíz del dominio dentro de la carpeta personal (por defecto aguasincal.es)
#   INDEXAR=no|si          "no" (por defecto) = web visible pero con noindex; "si" = lanzamiento
#   TELEFONO, WHATSAPP     p. ej. "600 12 34 56"; vacías = sin botones de llamar/WhatsApp
#   DOMINIO (aguasincal.es), FTP_VERIFICAR_CERT (si|no, por defecto si)
name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: despliegue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    if: vars.DESPLIEGUE_ACTIVO == 'si'
    runs-on: ubuntu-latest
    env:
      PANEL_RUTA: ${{ secrets.PANEL_RUTA }}
      DOMINIO: ${{ vars.DOMINIO || 'aguasincal.es' }}
      CARPETA_PUBLICA: ${{ vars.CARPETA_PUBLICA || 'aguasincal.es' }}
      INDEXAR: ${{ vars.INDEXAR || 'no' }}
      TELEFONO: ${{ vars.TELEFONO || '' }}
      WHATSAPP: ${{ vars.WHATSAPP || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Comprobar secretos y variables
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
          FTP_CLAVE: ${{ secrets.FTP_CLAVE }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_CLAVE: ${{ secrets.ADMIN_CLAVE }}
        run: |
          faltan=""
          for s in FTP_HOST FTP_USUARIO FTP_CLAVE SMTP_PASS PANEL_RUTA ADMIN_EMAIL ADMIN_CLAVE; do
            [ -n "${!s}" ] || faltan="$faltan $s"
          done
          if [ -n "$faltan" ]; then echo "::error::Faltan secretos:$faltan (ver docs/PASOS.md)"; exit 1; fi
          [[ "$PANEL_RUTA" =~ ^[a-z0-9][a-z0-9-]{2,40}$ ]] || { echo "::error::PANEL_RUTA solo puede tener minúsculas, números y guiones"; exit 1; }
          [ ${#ADMIN_CLAVE} -ge 12 ] || { echo "::error::ADMIN_CLAVE debe tener al menos 12 caracteres"; exit 1; }
          [[ "$CARPETA_PUBLICA" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] || { echo "::error::CARPETA_PUBLICA no válida (p. ej. aguasincal.es)"; exit 1; }

      - name: Instalar dependencias y pasar los tests
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          vendor/bin/phpunit

      - name: Generar la web
        run: |
          # Ruta de la app relativa a la raíz del dominio: una subida (../) por cada nivel de CARPETA_PUBLICA.
          niveles=$(echo "$CARPETA_PUBLICA" | tr '/' '\n' | grep -c .)
          app_rel="$(printf '../%.0s' $(seq 1 "$niveles"))aguasincal-app"
          ARGS="--salida=dist --app=$app_rel --panel=$PANEL_RUTA"
          if [ "$INDEXAR" != "si" ]; then ARGS="$ARGS --noindex"; fi
          php build/build.php $ARGS

      - name: Preparar el paquete de la aplicación
        run: |
          mkdir -p paquete
          cp -r app config migrations templates scripts composer.json composer.lock paquete/
          composer install --working-dir=paquete --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Escribir config.local.php
        env:
          LEADS_EMAIL: ${{ secrets.LEADS_EMAIL }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_CLAVE: ${{ secrets.ADMIN_CLAVE }}
        run: |
          umask 077
          php -r '
            $d = getenv("DOMINIO");
            $usuario = getenv("SMTP_USUARIO") ?: "info@" . $d;
            $c = [
              "entorno" => "produccion",
              "url" => "https://" . $d,
              "leads_email" => getenv("LEADS_EMAIL") ?: "info@" . $d,
              "panel_ruta" => getenv("PANEL_RUTA"),
              "contacto" => ["telefono" => (string) getenv("TELEFONO"), "whatsapp" => (string) getenv("WHATSAPP")],
              // Solo se usa si aún no hay ningún usuario del panel. La contraseña en claro no sale de GitHub.
              "admin_inicial" => ["email" => getenv("ADMIN_EMAIL"), "hash" => password_hash(getenv("ADMIN_CLAVE"), PASSWORD_BCRYPT)],
              "correo" => [
                "transporte" => "smtp",
                "host" => getenv("SMTP_HOST") ?: "mail." . $d,
                "puerto" => 465,
                "seguridad" => "ssl",
                "usuario" => $usuario,
                "clave" => getenv("SMTP_PASS"),
                "remitente" => $usuario,
                "remitente_nombre" => "AguaSinCal",
              ],
            ];
            file_put_contents("config.local.php", "<?php\n// Generado por el despliegue. No editar: se sobrescribe.\nreturn " . var_export($c, true) . ";\n");
          '

      - name: Subir por FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
          LFTP_PASSWORD: ${{ secrets.FTP_CLAVE }}
          FTP_VERIFICAR_CERT: ${{ vars.FTP_VERIFICAR_CERT || 'si' }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          scripts/desplegar-ftp.sh dist paquete config.local.php
          rm -f config.local.php

      - name: Comprobaciones tras el despliegue
        run: |
          comprobar() {
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMINIO$1")
            echo "$1 → $codigo (esperado $2)"
            [[ "$codigo" =~ ^($2)$ ]] || { echo "::error::$1 devolvió $codigo. $3"; exit 1; }
          }
          comprobar / 200 "¿Es correcta la variable CARPETA_PUBLICA?"
          comprobar /descalcificadores/ 200
          comprobar "/presupuesto/?servicio=descalcificadores&tipo=particular&cp=08201" 200 "Revisa que PHP tenga activadas pdo_sqlite, sqlite3 y mbstring (cPanel → Seleccionar versión de PHP)."
          comprobar "/$PANEL_RUTA/" 303
          comprobar /_app.php 403
          comprobar /_build.json 403
          comprobar /noexiste-xyz/ 404
          cabeceras=$(curl -sI "https://$DOMINIO/")
          echo "$cabeceras" | grep -qi 'content-security-policy' || { echo "::error::Faltan las cabeceras de seguridad (.htaccess)"; exit 1; }
          if [ "$INDEXAR" != "si" ]; then
            echo "$cabeceras" | grep -qi 'x-robots-tag: noindex' || { echo "::error::La vista previa debería llevar X-Robots-Tag: noindex"; exit 1; }
            echo "Vista previa publicada (fuera de Google): https://$DOMINIO/"
          else
            echo "Web publicada e indexable: https://$DOMINIO/"
          fi
          echo "Panel: https://$DOMINIO/$PANEL_RUTA/"
