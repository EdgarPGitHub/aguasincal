# Comprobación previa a publicar: revisa los secretos y entra por FTP SIN subir ni cambiar nada.
# Se lanza a mano: Actions → Comprobar servidor → Run workflow. El resumen aparece en la página de la ejecución.
name: Comprobar servidor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    env:
      CARPETA_PUBLICA: ${{ vars.CARPETA_PUBLICA || 'aguasincal.es' }}
      DOMINIO: ${{ vars.DOMINIO || 'aguasincal.es' }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
      FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
      LFTP_PASSWORD: ${{ secrets.FTP_CLAVE }}
      FTP_VERIFICAR_CERT: ${{ vars.FTP_VERIFICAR_CERT || 'si' }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      PANEL_RUTA: ${{ secrets.PANEL_RUTA }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_CLAVE: ${{ secrets.ADMIN_CLAVE }}
      LEADS_EMAIL: ${{ secrets.LEADS_EMAIL }}
    steps:
      - name: Secretos y variables
        run: |
          r=$GITHUB_STEP_SUMMARY
          echo "## Secretos y variables" >> $r
          mal=0
          for s in FTP_HOST FTP_USUARIO LFTP_PASSWORD SMTP_PASS PANEL_RUTA ADMIN_EMAIL ADMIN_CLAVE; do
            nombre=$s; [ "$s" = LFTP_PASSWORD ] && nombre=FTP_CLAVE
            if [ -n "${!s}" ]; then echo "- ✅ \`$nombre\` definido" >> $r; else echo "- ❌ \`$nombre\` FALTA" >> $r; mal=1; fi
          done
          if [ -n "$LEADS_EMAIL" ]; then echo "- ✅ \`LEADS_EMAIL\` definido" >> $r; else echo "- ℹ️ \`LEADS_EMAIL\` no definido: los leads irán a info@$DOMINIO" >> $r; fi
          if [[ "$PANEL_RUTA" =~ ^[a-z0-9][a-z0-9-]{2,40}$ ]]; then echo "- ✅ \`PANEL_RUTA\` con formato válido" >> $r; else echo "- ❌ \`PANEL_RUTA\` solo puede tener minúsculas, números y guiones (3–41 caracteres)" >> $r; mal=1; fi
          if [ ${#ADMIN_CLAVE} -ge 12 ]; then echo "- ✅ \`ADMIN_CLAVE\` tiene 12 caracteres o más" >> $r; else echo "- ❌ \`ADMIN_CLAVE\` debe tener al menos 12 caracteres" >> $r; mal=1; fi
          if [[ "$ADMIN_EMAIL" == *@*.* ]]; then echo "- ✅ \`ADMIN_EMAIL\` parece un email" >> $r; else echo "- ❌ \`ADMIN_EMAIL\` no parece un email" >> $r; mal=1; fi
          echo "- ℹ️ Variable \`CARPETA_PUBLICA\` = \`$CARPETA_PUBLICA\`" >> $r
          if [ "${{ vars.DESPLIEGUE_ACTIVO }}" = "si" ]; then echo "- ℹ️ \`DESPLIEGUE_ACTIVO\` = si (la publicación está activada)" >> $r; else echo "- ℹ️ \`DESPLIEGUE_ACTIVO\` sin activar (normal hasta el último paso)" >> $r; fi
          exit $mal

      - name: Acceso FTP (solo lectura)
        if: always()
        run: |
          r=$GITHUB_STEP_SUMMARY
          echo "## Acceso FTP" >> $r
          sudo apt-get install -y -qq lftp > /dev/null
          VERIFICAR=yes; [ "$FTP_VERIFICAR_CERT" = "no" ] && VERIFICAR=no
          AJUSTES="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate $VERIFICAR; set ftp:passive-mode true; set net:timeout 30; set net:max-retries 2; set cmd:fail-exit true"
          if ! timeout 90 lftp -c "$AJUSTES; open --env-password -u \"$FTP_USUARIO\" -p $FTP_PORT \"$FTP_HOST\"; cls -1a" < /dev/null > listado.txt 2> error.txt; then
            echo "- ❌ No se puede entrar por FTP con cifrado. Error:" >> $r
            echo '```' >> $r; sed 's/^/  /' error.txt | head -5 >> $r; echo '```' >> $r
            if grep -qi certificate error.txt; then
              echo "- 👉 El certificado del servidor no coincide con \`FTP_HOST\`. Pon en \`FTP_HOST\` el nombre del servidor de Raiola (no ftp.aguasincal.es)." >> $r
            fi
            exit 1
          fi
          echo "- ✅ Entra por FTP cifrado (FTPS) con certificado verificado: $VERIFICAR" >> $r
          echo "- Contenido de la carpeta de la cuenta FTP:" >> $r
          echo '```' >> $r; grep -v '^\.\{1,2\}/\?$' listado.txt | sort >> $r; echo '```' >> $r
          if grep -qx "$CARPETA_PUBLICA/\?" listado.txt; then
            echo "- ✅ Existe la carpeta pública \`$CARPETA_PUBLICA\`" >> $r
          else
            echo "- ❌ No encuentro la carpeta \`$CARPETA_PUBLICA\` dentro de la cuenta FTP" >> $r
            exit 1
          fi

      - name: Web y certificado
        if: always()
        run: |
          r=$GITHUB_STEP_SUMMARY
          echo "## Web" >> $r
          if codigo=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMINIO/"); then
            echo "- ✅ https://$DOMINIO responde con certificado válido (código $codigo)" >> $r
          else
            echo "- ❌ https://$DOMINIO no responde o el certificado no es válido" >> $r
            exit 1
          fi
